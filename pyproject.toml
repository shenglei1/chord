[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-hyper-warehouse"
version = "0.1.0"
description = "Structured hypergraph reinforcement learning for open warehouse robot-picker assignment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "gymnasium==0.29.1",
  "networkx==3.2.1",
  "numpy>=1.26",
  "six==1.16.0",
  "scipy>=1.11,<2",
  "torch>=2.2",
  "torch-geometric>=2.6.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
plot = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["open_hyper_warehouse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
