[env]
width = 16
height = 12
max_agvs = 24
max_pickers = 12
max_tasks = 80
initial_agvs_min = 8
initial_agvs_max = 14
initial_pickers_min = 4
initial_pickers_max = 7
initial_tasks_min = 12
initial_tasks_max = 24
episode_steps = 256
order_arrival_rate = 0.20
order_cancel_probability = 0.005
agent_join_probability = 0.015
agent_leave_probability = 0.010
deadline_min = 45
deadline_max = 110
step_penalty = 0.002
contention_penalty = 0.02
deadline_penalty = 0.25
pickup_reward = 0.10
delivery_reward = 1.0
num_zones = 4
task_hotspot_probability = 0.0
arrival_profile = "stationary"
agent_spawn_mode = "uniform_depot"
picker_service_delay_min = 0
picker_service_delay_max = 1
scheduled_breakdown_step = -1
scheduled_breakdown_count = 0
scheduled_repair_step = -1
scheduled_repair_count = 0
picker_shift_step = -1
picker_shift_leave_count = 0
picker_shift_join_count = 0

[train]
# Identical Core-8 environment and interaction protocol to the EAAI MAPPO runs.
# MOHITO retains its published off-policy Actor/Critic/GNN objective.
total_steps = 1024000
num_envs = 8
rollout_steps = 256
update_epochs = 4
minibatch_size = 512
learning_rate = 0.0003
gamma = 0.99
gae_lambda = 0.95
ppo_clip = 0.2
entropy_coef = 0.01
entropy_coef_final = 0.001
entropy_anneal_fraction = 0.60
value_coef = 0.5
max_grad_norm = 0.5
hidden_dim = 128
encoder_layers = 2
checkpoint_interval = 102400
device = "cpu"
parallel_env_workers = 8

[model]
coalition_top_k = 3
reservation_max_rounds = 0
num_groups = 4
attention_heads = 4
mohito_actor_lr = 0.009
mohito_critic_lr = 0.01
mohito_hidden_dim = 24
mohito_layers = 3
mohito_heads = 2
mohito_tau = 0.005
mohito_replay_size = 1000
mohito_batch_size = 16
mohito_warmup_steps = 1000
# Official MOHITO controller cadence.  It halves the replay update-to-data
# ratio relative to the 256 pilot while retaining the same environment budget,
# Actor/Critic/GNN objective, replay size and batch size.  It gives 2,000
# backups over 1.024M interactions.
mohito_experiences_before_update = 512
mohito_backups_per_update = 1
mohito_initial_epsilon = 0.9
# Preserve the original cadence-32 exploration schedule as a function of
# environment experience: 0.984119442 ~= 0.999 ** (512 / 32).
mohito_epsilon_decay = 0.984119442
mohito_min_epsilon = 0.001

[evaluation]
episodes = 100
bootstrap_samples = 5000
deterministic = true
scenario_names = [
  "in_distribution", "unseen_small", "unseen_large",
  "agv_heavy_ratio", "picker_heavy_ratio",
  "picker_shift", "fixed_team_dynamic_orders", "robot_breakdown",
]
