[env]
width = 10
height = 8
max_agvs = 8
max_pickers = 5
max_tasks = 20
initial_agvs_min = 3
initial_agvs_max = 5
initial_pickers_min = 2
initial_pickers_max = 3
initial_tasks_min = 4
initial_tasks_max = 7
episode_steps = 24
order_arrival_rate = 0.20
order_cancel_probability = 0.01
agent_join_probability = 0.03
agent_leave_probability = 0.02
deadline_min = 12
deadline_max = 24
step_penalty = 0.002
contention_penalty = 0.02
deadline_penalty = 0.25
pickup_reward = 0.10
delivery_reward = 1.0
num_zones = 2
task_hotspot_probability = 0.0
arrival_profile = "stationary"
agent_spawn_mode = "uniform_depot"
picker_service_delay_min = 0
picker_service_delay_max = 1
scheduled_breakdown_step = -1
scheduled_breakdown_count = 0
scheduled_repair_step = -1
scheduled_repair_count = 0
picker_shift_step = -1
picker_shift_leave_count = 0
picker_shift_join_count = 0

[train]
total_steps = 64
num_envs = 2
rollout_steps = 16
update_epochs = 1
minibatch_size = 32
learning_rate = 0.0003
gamma = 0.99
gae_lambda = 0.95
ppo_clip = 0.2
entropy_coef = 0.01
value_coef = 0.5
max_grad_norm = 0.5
hidden_dim = 32
encoder_layers = 1
checkpoint_interval = 64
device = "cpu"

[model]
coalition_top_k = 2
reservation_max_rounds = 0
num_groups = 2
attention_heads = 2
mohito_actor_lr = 0.009
mohito_critic_lr = 0.01
mohito_hidden_dim = 24
mohito_layers = 3
mohito_heads = 2
mohito_tau = 0.005
mohito_replay_size = 64
mohito_batch_size = 4
mohito_warmup_steps = 64
mohito_experiences_before_update = 1
mohito_backups_per_update = 1
mohito_initial_epsilon = 0.9
mohito_epsilon_decay = 0.999
mohito_min_epsilon = 0.001

[evaluation]
episodes = 2
bootstrap_samples = 100
deterministic = true
scenario_names = [
  "in_distribution", "unseen_small", "unseen_large",
  "agv_heavy_ratio", "picker_heavy_ratio",
  "picker_shift", "fixed_team_dynamic_orders", "robot_breakdown",
]
